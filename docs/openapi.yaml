      oneOf:
        - { $ref: "#/components/schemas/POSQRPaymentRequest" }
        - { $ref: "#/components/schemas/POSCashPaymentRequest" }
      discriminator:
        propertyName: method
        mapping:
          QR_CODE: "#/components/schemas/POSQRPaymentRequest"
          REAL_MONEY: "#/components/schemas/POSCashPaymentRequest"
