openapi: 3.1.0
info:
  title: Intania Shop API
  version: 1.0.0
  description: |
    Admin-only catalogue, inventory, and upload backend for the ESC Chula Intania Shop.
    Identity comes from Google OAuth and a JWT. Business operations require the ADMIN role.

    Project/POS operations are contract-first and marked as planned; they are visible for
    frontend development but are not implemented by the current server.
servers:
  - url: /
    description: Same host as this documentation
tags:
  - { name: Service }
  - { name: Authentication }
  - { name: Products, description: "Admin-only product catalogue" }
  - { name: Inventory }
  - { name: Uploads }
  - { name: Projects, description: "PLANNED — event project administration; not implemented" }
  - { name: Project Products, description: "PLANNED — project catalogue selection and pricing; not implemented" }
  - { name: Project Promotions, description: "PLANNED — project-scoped pricing promotions; not implemented" }
  - { name: POS, description: "PLANNED — event POS catalogue, quotation, and checkout; not implemented" }
  - { name: Project Orders, description: "PLANNED — project POS history and reporting; not implemented" }
paths:
  /:
    get:
      operationId: getServiceName
      tags: [Service]
      summary: Get service name
      responses:
        "200":
          description: Service name
          content:
            text/plain:
              schema: { type: string, example: intania-shop-api }
  /health:
    get:
      operationId: getHealth
      tags: [Service]
      summary: Check service and database health
      responses:
        "200":
          description: Healthy
          content:
            text/plain:
              schema: { type: string, const: ok }
        "503":
          description: Database unavailable
          content:
            text/plain:
              schema: { type: string, const: unavailable }
  /auth/google:
    get:
      operationId: startGoogleOAuth
      tags: [Authentication]
      summary: Start Google OAuth with PKCE
      description: Returns the Google authorization URL and sets an OAuth state cookie.
      responses:
        "200": { $ref: "#/components/responses/AuthStart" }
        "500": { $ref: "#/components/responses/Error" }
  /auth/google/redirect:
    get:
      operationId: redirectToGoogleOAuth
      tags: [Authentication]
      summary: Redirect to Google OAuth
      responses:
        "307":
          description: Temporary redirect to Google
          headers:
            Location:
              schema: { type: string, format: uri }
        "500": { $ref: "#/components/responses/Error" }
  /auth/google/callback:
    get:
      operationId: completeGoogleOAuth
      tags: [Authentication]
      summary: Complete Google OAuth and issue a JWT
      parameters:
        - { name: code, in: query, schema: { type: string }, description: Required on a successful callback }
        - { name: state, in: query, schema: { type: string }, description: Required on a successful callback }
        - { name: error, in: query, schema: { type: string } }
        - { name: error_description, in: query, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Login" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /products:
    get:
      operationId: listProducts
      tags: [Products]
      summary: List products
      description: Admin only.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - name: include_variants
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200": { $ref: "#/components/responses/ProductList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    post:
      operationId: createProduct
      tags: [Products]
      summary: Create product
      description: Admin only.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/CreateProduct" }
      responses:
        "201": { $ref: "#/components/responses/ProductDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /products/search:
    get:
      operationId: searchProducts
      tags: [Products]
      summary: Search products
      description: Admin only.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200": { $ref: "#/components/responses/ProductSearch" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /products/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      operationId: getProduct
      tags: [Products]
      summary: Get product details
      description: Admin only.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/ProductDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateProduct
      tags: [Products]
      summary: Update product
      description: Admin only. Supplied fields replace existing values.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/UpdateProduct" }
      responses:
        "200": { $ref: "#/components/responses/ProductDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteProduct
      tags: [Products]
      summary: Delete product
      description: Admin only.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Product deleted }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /products/{id}/variants:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      operationId: createProductVariant
      tags: [Products]
      summary: Create product variant
      description: Admin only.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/Variant" }
      responses:
        "201": { $ref: "#/components/responses/Variant" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /variants/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    put:
      operationId: updateVariant
      tags: [Products]
      summary: Update product variant
      description: Admin only.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/Variant" }
      responses:
        "200": { $ref: "#/components/responses/Variant" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteVariant
      tags: [Products]
      summary: Delete product variant
      description: Admin only.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Variant deleted }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /products/{id}/stock/adjust:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      operationId: adjustProductStock
      tags: [Inventory]
      summary: Adjust product or variant stock
      description: Admin only.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdjustStockRequest" }
      responses:
        "201": { $ref: "#/components/responses/StockTransaction" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /products/{id}/stock/transactions:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      operationId: listProductStockTransactions
      tags: [Inventory]
      summary: List product stock history
      description: Admin only.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PageSize" }]
      responses:
        "200": { $ref: "#/components/responses/StockTransactionList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /variants/{id}/stock/transactions:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      operationId: listVariantStockTransactions
      tags: [Inventory]
      summary: List variant stock history
      description: Admin only.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PageSize" }]
      responses:
        "200": { $ref: "#/components/responses/StockTransactionList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /stock/transactions:
    get:
      operationId: listStockTransactions
      tags: [Inventory]
      summary: List all stock history
      description: Admin only.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PageSize" }]
      responses:
        "200": { $ref: "#/components/responses/StockTransactionList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /upload/product-images:
    post:
      operationId: uploadProductImages
      tags: [Uploads]
      summary: Upload product images
      description: Admin only. Maximum request size is 100 MiB.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/Files" }
      responses:
        "200": { $ref: "#/components/responses/UploadMany" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /stock/upload-proof-images:
    post:
      operationId: uploadStockProofImage
      tags: [Uploads]
      summary: Upload one stock proof image
      description: Admin only. Maximum request size is 10 MiB.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200": { $ref: "#/components/responses/UploadOne" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /projects:
    get:
      operationId: listProjects
      tags: [Projects]
      summary: List projects
      description: Admin only. Filters are applied before pagination. Results use a stable `created_at DESC, project_id DESC` order.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: name, in: query, description: Case-insensitive partial name match, schema: { type: string, maxLength: 150 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ProjectStatus" } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200": { $ref: "#/components/responses/ProjectList" }
        "400": { $ref: "#/components/responses/ProjectAPIError" }
        "401": { $ref: "#/components/responses/ProjectAPIError" }
        "403": { $ref: "#/components/responses/ProjectAPIError" }
        "500": { $ref: "#/components/responses/ProjectAPIError" }
    post:
      operationId: createProject
      tags: [Projects]
      summary: Create a project
      description: Admin only. An omitted `end_date` is normalized to `start_date`.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/ProjectMutation" }
      responses:
        "201": { $ref: "#/components/responses/Project" }
        "400": { $ref: "#/components/responses/ProjectAPIError" }
        "401": { $ref: "#/components/responses/ProjectAPIError" }
        "403": { $ref: "#/components/responses/ProjectAPIError" }
        "500": { $ref: "#/components/responses/ProjectAPIError" }
  /projects/{project_id}:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      operationId: getProject
      tags: [Projects]
      summary: Get a project
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Project" }
        "400": { $ref: "#/components/responses/ProjectAPIError" }
        "401": { $ref: "#/components/responses/ProjectAPIError" }
        "403": { $ref: "#/components/responses/ProjectAPIError" }
        "404": { $ref: "#/components/responses/ProjectAPIError" }
        "500": { $ref: "#/components/responses/ProjectAPIError" }
    put:
      operationId: updateProject
      tags: [Projects]
      summary: Update a project
      description: Admin only. Name and description remain correctable; sale dates become immutable after the first project order.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/ProjectMutation" }
      responses:
        "200": { $ref: "#/components/responses/Project" }
        "400": { $ref: "#/components/responses/ProjectAPIError" }
        "401": { $ref: "#/components/responses/ProjectAPIError" }
        "403": { $ref: "#/components/responses/ProjectAPIError" }
        "404": { $ref: "#/components/responses/ProjectAPIError" }
        "409": { $ref: "#/components/responses/ProjectAPIError" }
        "500": { $ref: "#/components/responses/ProjectAPIError" }
    delete:
      operationId: deleteProject
      tags: [Projects]
      summary: Delete a project with no orders
      description: Admin only. Configuration is deleted with the project. A project with any order returns `PROJECT_HAS_ORDERS`.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Project deleted }
        "400": { $ref: "#/components/responses/ProjectAPIError" }
        "401": { $ref: "#/components/responses/ProjectAPIError" }
        "403": { $ref: "#/components/responses/ProjectAPIError" }
        "404": { $ref: "#/components/responses/ProjectAPIError" }
        "409": { $ref: "#/components/responses/ProjectAPIError" }
        "500": { $ref: "#/components/responses/ProjectAPIError" }
  /projects/{project_id}/product-candidates:
    get:
      operationId: listProjectProductCandidates
      tags: [Project Products]
      summary: List products eligible for project selection
      description: Admin only. Products are grouped with their sellable items and current selection state.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { name: name, in: query, schema: { type: string, maxLength: 150 } }
        - { name: category, in: query, schema: { type: string, maxLength: 100 } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200": { $ref: "#/components/responses/ProjectProductCandidates" }
        "400": { $ref: "#/components/responses/ProjectAPIError" }
        "401": { $ref: "#/components/responses/ProjectAPIError" }
        "403": { $ref: "#/components/responses/ProjectAPIError" }
        "404": { $ref: "#/components/responses/ProjectAPIError" }
        "500": { $ref: "#/components/responses/ProjectAPIError" }
  /projects/{project_id}/products:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      operationId: listProjectProducts
      tags: [Project Products]
      summary: List assigned project products
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/ProjectProducts" }
        "400": { $ref: "#/components/responses/ProjectAPIError" }
        "401": { $ref: "#/components/responses/ProjectAPIError" }
        "403": { $ref: "#/components/responses/ProjectAPIError" }
        "404": { $ref: "#/components/responses/ProjectAPIError" }
        "500": { $ref: "#/components/responses/ProjectAPIError" }
    put:
      operationId: replaceProjectProducts
      tags: [Project Products]
      summary: Atomically replace project product assignments
      description: Admin only. The supplied list is the complete desired selection. Any validation failure rejects the entire replacement. Completed projects reject changes.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/ReplaceProjectProducts" }
      responses:
        "200": { $ref: "#/components/responses/ProjectProducts" }
        "400": { $ref: "#/components/responses/ProjectAPIError" }
        "401": { $ref: "#/components/responses/ProjectAPIError" }
        "403": { $ref: "#/components/responses/ProjectAPIError" }
        "404": { $ref: "#/components/responses/ProjectAPIError" }
        "409": { $ref: "#/components/responses/ProjectAPIError" }
        "500": { $ref: "#/components/responses/ProjectAPIError" }
  /projects/{project_id}/promotions:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      operationId: listProjectPromotions
      tags: [Project Promotions]
      summary: List project pricing promotions
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/ProjectPromotionList" }
        "400": { $ref: "#/components/responses/ProjectAPIError" }
        "401": { $ref: "#/components/responses/ProjectAPIError" }
        "403": { $ref: "#/components/responses/ProjectAPIError" }
        "404": { $ref: "#/components/responses/ProjectAPIError" }
        "500": { $ref: "#/components/responses/ProjectAPIError" }
    post:
      operationId: createProjectPromotion
      tags: [Project Promotions]
      summary: Create a project pricing promotion
      description: Admin only. The promotion price cannot exceed the current original bundle price. Completed projects reject changes.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/ProjectPromotionMutation" }
      responses:
        "201": { $ref: "#/components/responses/ProjectPromotion" }
        "400": { $ref: "#/components/responses/ProjectAPIError" }
        "401": { $ref: "#/components/responses/ProjectAPIError" }
        "403": { $ref: "#/components/responses/ProjectAPIError" }
        "404": { $ref: "#/components/responses/ProjectAPIError" }
        "409": { $ref: "#/components/responses/ProjectAPIError" }
        "500": { $ref: "#/components/responses/ProjectAPIError" }
  /projects/{project_id}/promotions/{promotion_id}:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/PromotionID" }
    get:
      operationId: getProjectPromotion
      tags: [Project Promotions]
      summary: Get a project pricing promotion
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/ProjectPromotion" }
        "400": { $ref: "#/components/responses/ProjectAPIError" }
        "401": { $ref: "#/components/responses/ProjectAPIError" }
        "403": { $ref: "#/components/responses/ProjectAPIError" }
        "404": { $ref: "#/components/responses/ProjectAPIError" }
        "500": { $ref: "#/components/responses/ProjectAPIError" }
    put:
      operationId: updateProjectPromotion
      tags: [Project Promotions]
      summary: Update a project pricing promotion
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/ProjectPromotionMutation" }
      responses:
        "200": { $ref: "#/components/responses/ProjectPromotion" }
        "400": { $ref: "#/components/responses/ProjectAPIError" }
        "401": { $ref: "#/components/responses/ProjectAPIError" }
        "403": { $ref: "#/components/responses/ProjectAPIError" }
        "404": { $ref: "#/components/responses/ProjectAPIError" }
        "409": { $ref: "#/components/responses/ProjectAPIError" }
        "500": { $ref: "#/components/responses/ProjectAPIError" }
    delete:
      operationId: deleteProjectPromotion
      tags: [Project Promotions]
      summary: Delete a project pricing promotion
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Promotion deleted }
        "400": { $ref: "#/components/responses/ProjectAPIError" }
        "401": { $ref: "#/components/responses/ProjectAPIError" }
        "403": { $ref: "#/components/responses/ProjectAPIError" }
        "404": { $ref: "#/components/responses/ProjectAPIError" }
        "409": { $ref: "#/components/responses/ProjectAPIError" }
        "500": { $ref: "#/components/responses/ProjectAPIError" }
  /projects/{project_id}/pos:
    get:
      operationId: getProjectPOSCatalog
      tags: [POS]
      summary: Get the project POS catalogue
      description: Admin only. Preview is available in any project status; `can_checkout` is true only while ACTIVE. Category groups are sorted case-insensitively by name in ascending order, with the null category last.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      responses:
        "200": { $ref: "#/components/responses/POSCatalog" }
        "400": { $ref: "#/components/responses/ProjectAPIError" }
        "401": { $ref: "#/components/responses/ProjectAPIError" }
        "403": { $ref: "#/components/responses/ProjectAPIError" }
        "404": { $ref: "#/components/responses/ProjectAPIError" }
        "500": { $ref: "#/components/responses/ProjectAPIError" }
  /projects/{project_id}/checkout/quote:
    post:
      operationId: quoteProjectPOSCheckout
      tags: [POS]
      summary: Validate and price a POS cart
      description: Admin only. Available only while the project is ACTIVE. Client-supplied prices, discounts, and totals are never accepted.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      requestBody: { $ref: "#/components/requestBodies/POSQuote" }
      responses:
        "200": { $ref: "#/components/responses/POSQuote" }
        "400": { $ref: "#/components/responses/ProjectAPIError" }
        "401": { $ref: "#/components/responses/ProjectAPIError" }
        "403": { $ref: "#/components/responses/ProjectAPIError" }
        "404": { $ref: "#/components/responses/ProjectAPIError" }
        "409": { $ref: "#/components/responses/ProjectAPIError" }
        "500": { $ref: "#/components/responses/ProjectAPIError" }
  /upload/payment-slips:
    post:
      operationId: uploadPaymentSlip
      tags: [Uploads, POS]
      summary: Upload a trusted POS QR payment slip
      description: Admin only. Accepts one image up to 10 MiB. Checkout references the returned object key rather than an arbitrary URL.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/PaymentSlipUpload" }
      responses:
        "201": { $ref: "#/components/responses/PaymentSlip" }
        "400": { $ref: "#/components/responses/ProjectAPIError" }
        "401": { $ref: "#/components/responses/ProjectAPIError" }
        "403": { $ref: "#/components/responses/ProjectAPIError" }
        "413": { $ref: "#/components/responses/ProjectAPIError" }
        "500": { $ref: "#/components/responses/ProjectAPIError" }
  /projects/{project_id}/orders:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    post:
      operationId: createProjectPOSOrder
      tags: [POS, Project Orders]
      summary: Atomically create a paid POS order and reduce stock
      description: Admin only and ACTIVE projects only. Identical retries return the original order; a key reused with different content returns `IDEMPOTENCY_KEY_REUSED`.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/POSCheckout" }
      responses:
        "201": { $ref: "#/components/responses/POSOrder" }
        "200": { $ref: "#/components/responses/POSOrderReplay" }
        "400": { $ref: "#/components/responses/ProjectAPIError" }
        "401": { $ref: "#/components/responses/ProjectAPIError" }
        "403": { $ref: "#/components/responses/ProjectAPIError" }
        "404": { $ref: "#/components/responses/ProjectAPIError" }
        "409": { $ref: "#/components/responses/ProjectAPIError" }
        "500": { $ref: "#/components/responses/ProjectAPIError" }
    get:
      operationId: listProjectPOSOrders
      tags: [Project Orders]
      summary: List project POS orders
      description: Admin only. The default range starts at project start 00:00:00 Asia/Bangkok and ends at the current time.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: order_number, in: query, schema: { type: string, maxLength: 100 } }
        - { name: payment_method, in: query, schema: { $ref: "#/components/schemas/POSPaymentMethod" } }
        - { name: staff_id, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: created_from, in: query, schema: { type: string, format: date-time } }
        - { name: created_to, in: query, schema: { type: string, format: date-time } }
        - { name: sort_by, in: query, schema: { type: string, enum: [order_number, net_total], default: order_number } }
        - { name: sort_order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200": { $ref: "#/components/responses/POSOrderList" }
        "400": { $ref: "#/components/responses/ProjectAPIError" }
        "401": { $ref: "#/components/responses/ProjectAPIError" }
        "403": { $ref: "#/components/responses/ProjectAPIError" }
        "404": { $ref: "#/components/responses/ProjectAPIError" }
        "500": { $ref: "#/components/responses/ProjectAPIError" }
  /projects/{project_id}/orders/export:
    get:
      operationId: exportProjectPOSOrders
      tags: [Project Orders]
      summary: Export filtered project POS orders as Excel
      description: Admin only. Uses the history filters and sorting without pagination. The workbook contains one row per order item with repeated order-level fields.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { name: order_number, in: query, schema: { type: string, maxLength: 100 } }
        - { name: payment_method, in: query, schema: { $ref: "#/components/schemas/POSPaymentMethod" } }
        - { name: staff_id, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: created_from, in: query, schema: { type: string, format: date-time } }
        - { name: created_to, in: query, schema: { type: string, format: date-time } }
        - { name: sort_by, in: query, schema: { type: string, enum: [order_number, net_total], default: order_number } }
        - { name: sort_order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        "200":
          description: Filtered Excel workbook
          headers:
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="Engineering_Fair_2026_orders_20260826T103000+0700.xlsx"' }
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/ProjectAPIError" }
        "401": { $ref: "#/components/responses/ProjectAPIError" }
        "403": { $ref: "#/components/responses/ProjectAPIError" }
        "404": { $ref: "#/components/responses/ProjectAPIError" }
        "500": { $ref: "#/components/responses/ProjectAPIError" }
  /projects/{project_id}/orders/{order_id}:
    get:
      operationId: getProjectPOSOrder
      tags: [Project Orders]
      summary: Get immutable project POS order details
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { $ref: "#/components/parameters/POSOrderID" }
      responses:
        "200": { $ref: "#/components/responses/POSOrder" }
        "400": { $ref: "#/components/responses/ProjectAPIError" }
        "401": { $ref: "#/components/responses/ProjectAPIError" }
        "403": { $ref: "#/components/responses/ProjectAPIError" }
        "404": { $ref: "#/components/responses/ProjectAPIError" }
        "500": { $ref: "#/components/responses/ProjectAPIError" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    Page:
      name: page
      in: query
      schema: { type: integer, format: int32, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, format: int32, minimum: 1, maximum: 100, default: 10 }
    ProjectID:
      name: project_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    PromotionID:
      name: promotion_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    POSOrderID:
      name: order_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID generated once per checkout attempt and reused only when retrying the identical request.
      schema: { type: string, format: uuid }
  requestBodies:
    CreateProduct:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CreateProductRequest" }
    UpdateProduct:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ProductInput" }
    Variant:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/VariantInput" }
    Files:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [files]
            properties:
              files:
                type: array
                minItems: 1
                items: { type: string, format: binary }
    ProjectMutation:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ProjectMutationRequest" }
          example: { name: Engineering Fair 2026, description: Main merchandise booth, start_date: "2026-09-05", end_date: "2026-09-07" }
    ReplaceProjectProducts:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ReplaceProjectProductsRequest" }
          example:
            items:
              - { product_id: 10, variant_id: 22, project_price: "299.00" }
              - { product_id: 11, variant_id: null, project_price: "59.00" }
    ProjectPromotionMutation:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ProjectPromotionMutationRequest" }
          example:
            name: Shirt and pin set
            promotion_price: "329.00"
            items:
              - { product_id: 10, variant_id: 22, quantity: 1 }
              - { product_id: 11, variant_id: null, quantity: 1 }
    POSQuote:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/POSCartRequest" }
          example:
            items:
              - { product_id: 10, variant_id: 22, quantity: 2 }
              - { product_id: 11, variant_id: null, quantity: 1 }
    PaymentSlipUpload:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file: { type: string, format: binary, description: "JPEG, PNG, or WebP image no larger than 10 MiB" }
    POSCheckout:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/POSCheckoutRequest" }
          examples:
            qr:
              summary: QR payment
              value:
                buyer: { gender: FEMALE, age: 21, student_alumni_year: Intania 105 }
                items: [{ product_id: 10, variant_id: 22, quantity: 1 }]
                payment: { method: QR_CODE, slip_object_key: payment-slips/2026/08/example.png, note: Paid at booth 1 }
            cashNoChange:
              summary: Cash with retained excess
              value:
                buyer: { gender: PREFER_NOT_TO_SAY, age: 0, student_alumni_year: null }
                items: [{ product_id: 11, variant_id: null, quantity: 2 }]
                payment: { method: REAL_MONEY, received_amount: "500.00", no_change: true, note: null }
  responses:
    Error:
      description: Request failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    AuthStart: { description: OAuth flow started, content: { application/json: { schema: { $ref: "#/components/schemas/AuthStartEnvelope" } } } }
    Login: { description: Authentication completed, content: { application/json: { schema: { $ref: "#/components/schemas/LoginEnvelope" } } } }
    ProductList: { description: Paginated products, content: { application/json: { schema: { $ref: "#/components/schemas/ProductListEnvelope" } } } }
    ProductSearch: { description: Matching products, content: { application/json: { schema: { $ref: "#/components/schemas/ProductSearchEnvelope" } } } }
    ProductDetail: { description: Product details, content: { application/json: { schema: { $ref: "#/components/schemas/ProductDetailEnvelope" } } } }
    Variant: { description: Product variant, content: { application/json: { schema: { $ref: "#/components/schemas/VariantEnvelope" } } } }
    StockTransaction: { description: Stock transaction, content: { application/json: { schema: { $ref: "#/components/schemas/StockTransactionEnvelope" } } } }
    StockTransactionList: { description: Stock transactions, content: { application/json: { schema: { $ref: "#/components/schemas/StockTransactionListEnvelope" } } } }
    UploadMany: { description: Uploaded objects, content: { application/json: { schema: { $ref: "#/components/schemas/UploadManyEnvelope" } } } }
    UploadOne: { description: Uploaded image, content: { application/json: { schema: { $ref: "#/components/schemas/UploadOneEnvelope" } } } }
    ProjectAPIError:
      description: Project/POS request failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ProjectAPIErrorResponse" }
          examples:
            validation: { value: { success: false, error: Project name is required, code: VALIDATION_ERROR, details: { fields: { name: Required } }, request_id: req_01J6B8K8QF4A } }
            projectNotFound: { value: { success: false, error: Project not found, code: PROJECT_NOT_FOUND, request_id: req_01J6B8K8QF4B } }
            stockConflict:
              value:
                success: false
                error: Requested quantity exceeds available stock
                code: INSUFFICIENT_STOCK
                details:
                  items: [{ product_id: 10, variant_id: 22, requested_quantity: 4, available_quantity: 2 }]
                request_id: req_01J6B8K8QF4C
    Project: { description: Project, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectEnvelope" } } } }
    ProjectList: { description: Paginated projects, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectListEnvelope" } } } }
    ProjectProductCandidates: { description: Paginated product candidates, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectProductCandidatesEnvelope" } } } }
    ProjectProducts: { description: Project product assignments, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectProductsEnvelope" } } } }
    ProjectPromotion: { description: Project pricing promotion, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectPromotionEnvelope" } } } }
    ProjectPromotionList: { description: Project pricing promotions, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectPromotionListEnvelope" } } } }
    POSCatalog: { description: Project POS catalogue, content: { application/json: { schema: { $ref: "#/components/schemas/POSCatalogEnvelope" } } } }
    POSQuote: { description: Server-calculated POS quotation, content: { application/json: { schema: { $ref: "#/components/schemas/POSQuoteEnvelope" } } } }
    PaymentSlip: { description: Trusted payment slip object, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentSlipEnvelope" } } } }
    POSOrder: { description: Newly created or retrieved POS order, content: { application/json: { schema: { $ref: "#/components/schemas/POSOrderEnvelope" } } } }
    POSOrderReplay:
      description: Existing POS order returned for an identical idempotent retry
      headers:
        Idempotency-Replayed: { schema: { type: boolean, const: true } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/POSOrderEnvelope" }
    POSOrderList: { description: Paginated project POS orders, content: { application/json: { schema: { $ref: "#/components/schemas/POSOrderListEnvelope" } } } }
  schemas:
    SuccessBase:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error: { type: string, example: Product not found }
    THBAmount:
      type: string
      pattern: '^(0|[1-9][0-9]*)\.[0-9]{2}$'
      description: Non-negative Thai baht amount with exactly two decimal places. JSON numbers are not accepted.
      example: "299.00"
    ProjectAPIErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - PROJECT_NOT_FOUND
        - PROJECT_NOT_ACTIVE
        - PROJECT_COMPLETED
        - PROJECT_HAS_ORDERS
        - PRODUCT_NOT_SELLABLE
        - PROMOTION_NOT_FOUND
        - INSUFFICIENT_STOCK
        - INVALID_PAYMENT_SLIP
        - IDEMPOTENCY_KEY_REUSED
        - AUTHENTICATION_REQUIRED
        - FORBIDDEN
        - INTERNAL_ERROR
    ProjectAPIErrorResponse:
      type: object
      additionalProperties: false
      required: [success, error, code, request_id]
      properties:
        success: { type: boolean, const: false }
        error: { type: string, minLength: 1, example: Requested quantity exceeds available stock }
        code: { $ref: "#/components/schemas/ProjectAPIErrorCode" }
        details: { type: object, additionalProperties: true }
        request_id: { type: string, minLength: 1, example: req_01J6B8K8QF4C }
    ProjectStatus:
      type: string
      enum: [NOT_STARTED, ACTIVE, COMPLETED]
      description: Derived from Bangkok's current date and the inclusive project date range.
    ProjectMutationRequest:
      type: object
      additionalProperties: false
      required: [name, start_date]
      properties:
        name: { type: string, minLength: 1, maxLength: 150, description: Trimmed before validation and persistence }
        description: { type: [string, "null"], maxLength: 2000 }
        start_date: { type: string, format: date }
        end_date: { type: [string, "null"], format: date, description: Omit or send null for a single-day project }
    Project:
      type: object
      additionalProperties: false
      required: [project_id, name, description, start_date, end_date, status, order_count, created_at, updated_at]
      properties:
        project_id: { type: integer, format: int64, minimum: 1, example: 7 }
        name: { type: string, maxLength: 150, example: Engineering Fair 2026 }
        description: { type: [string, "null"], maxLength: 2000, example: Main merchandise booth }
        start_date: { type: string, format: date, example: "2026-09-05" }
        end_date: { type: string, format: date, example: "2026-09-07" }
        status: { $ref: "#/components/schemas/ProjectStatus" }
        order_count: { type: integer, format: int64, minimum: 0, example: 42 }
        created_at: { type: string, format: date-time, example: "2026-08-26T10:00:00+07:00" }
        updated_at: { type: string, format: date-time, example: "2026-08-26T10:30:00+07:00" }
    Pagination:
      type: object
      required: [total, page, page_size, total_pages]
      properties:
        total: { type: integer, format: int64, minimum: 0 }
        page: { type: integer, format: int32, minimum: 1 }
        page_size: { type: integer, format: int32, minimum: 1, maximum: 100 }
        total_pages: { type: integer, format: int32, minimum: 0 }
    ProjectListData:
      allOf:
        - { $ref: "#/components/schemas/Pagination" }
        - type: object
          required: [projects]
          properties:
            projects: { type: array, items: { $ref: "#/components/schemas/Project" } }
    SellableItemReference:
      type: object
      required: [product_id, variant_id]
      properties:
        product_id: { type: integer, format: int64, minimum: 1 }
        variant_id: { type: [integer, "null"], format: int64, minimum: 1, description: Null only for a variantless product }
    ProjectProductAssignmentInput:
      allOf:
        - { $ref: "#/components/schemas/SellableItemReference" }
        - type: object
          required: [project_price]
          properties:
            project_price: { $ref: "#/components/schemas/THBAmount" }
    ReplaceProjectProductsRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/ProjectProductAssignmentInput" }
    ProjectSellableItem:
      type: object
      additionalProperties: false
      required: [product_id, variant_id, size, color, stock_quantity, default_price, selected, project_price]
      properties:
        product_id: { type: integer, format: int64, minimum: 1 }
        variant_id: { type: [integer, "null"], format: int64, minimum: 1 }
        size: { type: [string, "null"], maxLength: 20 }
        color: { type: [string, "null"], maxLength: 50 }
        stock_quantity: { type: integer, format: int32, minimum: 0 }
        default_price: { $ref: "#/components/schemas/THBAmount" }
        selected: { type: boolean }
        project_price:
          oneOf: [{ $ref: "#/components/schemas/THBAmount" }, { type: "null" }]
    ProjectProductCandidate:
      type: object
      additionalProperties: false
      required: [product_id, name, category, image_url, sellable_items]
      properties:
        product_id: { type: integer, format: int64, minimum: 1 }
        name: { type: string, maxLength: 150 }
        category: { type: [string, "null"], maxLength: 100 }
        image_url: { type: [string, "null"], format: uri }
        sellable_items: { type: array, minItems: 1, items: { $ref: "#/components/schemas/ProjectSellableItem" } }
    ProjectProductCandidatesData:
      allOf:
        - { $ref: "#/components/schemas/Pagination" }
        - type: object
          required: [products]
          properties:
            products: { type: array, items: { $ref: "#/components/schemas/ProjectProductCandidate" } }
    ProjectProductAssignment:
      type: object
      additionalProperties: false
      required: [product_id, variant_id, product_name, category, image_url, size, color, stock_quantity, project_price]
      properties:
        product_id: { type: integer, format: int64, minimum: 1 }
        variant_id: { type: [integer, "null"], format: int64, minimum: 1 }
        product_name: { type: string, maxLength: 150 }
        category: { type: [string, "null"], maxLength: 100 }
        image_url: { type: [string, "null"], format: uri }
        size: { type: [string, "null"], maxLength: 20 }
        color: { type: [string, "null"], maxLength: 50 }
        stock_quantity: { type: integer, format: int32, minimum: 0 }
        project_price: { $ref: "#/components/schemas/THBAmount" }
    ProjectProductsData:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ProjectProductAssignment" } }
    ProjectPromotionItemInput:
      allOf:
        - { $ref: "#/components/schemas/SellableItemReference" }
        - type: object
          required: [quantity]
          properties:
            quantity: { type: integer, format: int32, minimum: 1 }
    ProjectPromotionMutationRequest:
      type: object
      additionalProperties: false
      required: [name, promotion_price, items]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        promotion_price: { $ref: "#/components/schemas/THBAmount" }
        items:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/ProjectPromotionItemInput" }
    ProjectPromotionItem:
      allOf:
        - { $ref: "#/components/schemas/ProjectPromotionItemInput" }
        - type: object
          required: [product_name, size, color, unit_price]
          properties:
            product_name: { type: string, maxLength: 150 }
            size: { type: [string, "null"], maxLength: 20 }
            color: { type: [string, "null"], maxLength: 50 }
            unit_price: { $ref: "#/components/schemas/THBAmount" }
    ProjectPromotion:
      type: object
      additionalProperties: false
      required: [promotion_id, project_id, name, items, original_bundle_price, promotion_price, discount, created_at, updated_at]
      properties:
        promotion_id: { type: integer, format: int64, minimum: 1 }
        project_id: { type: integer, format: int64, minimum: 1 }
        name: { type: string, maxLength: 150 }
        items: { type: array, minItems: 1, items: { $ref: "#/components/schemas/ProjectPromotionItem" } }
        original_bundle_price: { $ref: "#/components/schemas/THBAmount" }
        promotion_price: { $ref: "#/components/schemas/THBAmount" }
        discount: { $ref: "#/components/schemas/THBAmount" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProjectPromotionListData:
      type: object
      additionalProperties: false
      required: [promotions]
      properties:
        promotions: { type: array, items: { $ref: "#/components/schemas/ProjectPromotion" } }
    POSCategory:
      type: object
      additionalProperties: false
      required: [name, products]
      properties:
        name: { type: [string, "null"], minLength: 1, maxLength: 100, description: Null identifies uncategorized products; this group is returned last after named categories sorted case-insensitively A-Z. }
        products: { type: array, items: { $ref: "#/components/schemas/ProjectProductAssignment" } }
    POSCatalog:
      type: object
      additionalProperties: false
      required: [project, can_checkout, categories]
      properties:
        project: { $ref: "#/components/schemas/Project" }
        can_checkout: { type: boolean, description: True only while project status is ACTIVE }
        categories: { type: array, description: Named categories sorted case-insensitively A-Z; the null category is last., items: { $ref: "#/components/schemas/POSCategory" } }
    POSCartItemRequest:
      allOf:
        - { $ref: "#/components/schemas/SellableItemReference" }
        - type: object
          required: [quantity]
          properties:
            quantity: { type: integer, format: int32, minimum: 1 }
    POSCartRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/POSCartItemRequest" }
    POSQuoteLineItem:
      type: object
      additionalProperties: false
      required: [product_id, variant_id, product_name, size, color, image_url, quantity, unit_price, line_total, available_quantity]
      properties:
        product_id: { type: integer, format: int64, minimum: 1 }
        variant_id: { type: [integer, "null"], format: int64, minimum: 1 }
        product_name: { type: string, maxLength: 150 }
        size: { type: [string, "null"], maxLength: 20 }
        color: { type: [string, "null"], maxLength: 50 }
        image_url: { type: [string, "null"], format: uri }
        quantity: { type: integer, format: int32, minimum: 1 }
        unit_price: { $ref: "#/components/schemas/THBAmount" }
        line_total: { $ref: "#/components/schemas/THBAmount" }
        available_quantity: { type: integer, format: int32, minimum: 0 }
    AppliedProjectPromotion:
      type: object
      additionalProperties: false
      required: [promotion_id, name, original_bundle_price, promotion_price, discount]
      properties:
        promotion_id: { type: integer, format: int64, minimum: 1 }
        name: { type: string, maxLength: 150 }
        original_bundle_price: { $ref: "#/components/schemas/THBAmount" }
        promotion_price: { $ref: "#/components/schemas/THBAmount" }
        discount: { $ref: "#/components/schemas/THBAmount" }
    POSQuote:
      type: object
      additionalProperties: false
      required: [project_id, items, subtotal, applied_promotion, discount, net_total, quoted_at]
      properties:
        project_id: { type: integer, format: int64, minimum: 1 }
        items: { type: array, minItems: 1, items: { $ref: "#/components/schemas/POSQuoteLineItem" } }
        subtotal: { $ref: "#/components/schemas/THBAmount" }
        applied_promotion:
          oneOf: [{ $ref: "#/components/schemas/AppliedProjectPromotion" }, { type: "null" }]
          description: At most one promotion, applied at most once. Highest discount wins; ties use oldest created_at then lowest ID.
        discount: { $ref: "#/components/schemas/THBAmount" }
        net_total: { $ref: "#/components/schemas/THBAmount" }
        quoted_at: { type: string, format: date-time }
    PaymentSlip:
      type: object
      additionalProperties: false
      required: [object_key, url, content_type, size]
      properties:
        object_key: { type: string, minLength: 1, maxLength: 1024, example: payment-slips/2026/08/example.png }
        url: { type: string, format: uri, example: "https://storage.googleapis.com/intania-shop/payment-slips/2026/08/example.png" }
        content_type: { type: string, enum: [image/jpeg, image/png, image/webp] }
        size: { type: integer, format: int64, minimum: 1, maximum: 10485760 }
