        variant_id: { type: [integer, "null"], format: int64, minimum: 1 }
        product_name: { type: string, maxLength: 150 }
        size: { type: [string, "null"], maxLength: 20 }
        color: { type: [string, "null"], maxLength: 50 }
        image_url: { type: [string, "null"], format: uri }
        quantity: { type: integer, format: int32, minimum: 1 }
        unit_price: { $ref: "#/components/schemas/THBAmount" }
        line_total: { $ref: "#/components/schemas/THBAmount" }
        inventory_transaction_id: { type: integer, format: int64, minimum: 1 }
