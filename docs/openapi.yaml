      type: object
      additionalProperties: false
      required: [method, slip_url, received_amount, change_amount, retained_amount, no_change, note]
      properties:
        method: { $ref: "#/components/schemas/POSPaymentMethod" }
        slip_url: { type: [string, "null"], format: uri, description: Present for QR_CODE and authorized for admin preview }
        received_amount:
          oneOf: [{ $ref: "#/components/schemas/THBAmount" }, { type: "null" }]
        change_amount:
          oneOf: [{ $ref: "#/components/schemas/THBAmount" }, { type: "null" }]
        retained_amount:
          oneOf: [{ $ref: "#/components/schemas/THBAmount" }, { type: "null" }]
        no_change: { type: [boolean, "null"] }
        note: { type: [string, "null"], maxLength: 500 }
