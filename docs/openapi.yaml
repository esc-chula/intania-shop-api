      type: object
      additionalProperties: false
      required: [method, slip_object_key]
      properties:
        method: { type: string, const: QR_CODE }
        slip_object_key: { type: string, minLength: 1, maxLength: 1024 }
        note: { type: [string, "null"], maxLength: 500 }
    POSCashPaymentRequest:
      type: object
      additionalProperties: false
      required: [method, received_amount, no_change]
      properties:
        method: { type: string, const: REAL_MONEY }
